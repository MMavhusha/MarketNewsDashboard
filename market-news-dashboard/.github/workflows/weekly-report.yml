# Scheduled weekly Executive Summary: builds the report from live data every
# Monday 05:00 UTC (07:00 SAST) and commits it to reports/ in this repo.
name: weekly-report
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: |
          python - << 'PY'
          from datetime import datetime, timezone
          from components.report_builder import build_report
          html = build_report(monthly=False)
          import pathlib
          out = pathlib.Path("reports"); out.mkdir(exist_ok=True)
          name = f"RisCura_Market_News_weekly_{datetime.now(timezone.utc):%Y%m%d}.html"
          (out / name).write_text(html)
          print("built", name, len(html), "bytes")
          PY
      - run: |
          git config user.name "report-bot"
          git config user.email "actions@github.com"
          git add reports/ && git commit -m "Weekly report $(date -u +%F)" && git push
