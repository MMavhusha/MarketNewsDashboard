# RisCura Market News — native theme (brand spec v1.4 web palette).
# Native theming reaches every widget by construction; assets/styles.css now
# carries only genuinely custom components (hero, cards, rows, timeline).

[theme]
base = "light"
primaryColor = "#FF671D"                # RisCura Orange
backgroundColor = "#F2F2F2"             # Paper
secondaryBackgroundColor = "#FFFFFF"
textColor = "#212322"                   # Charcoal
linkColor = "#003B71"                   # Anthracite; hover handled in CSS
linkUnderline = false
borderColor = "#E2E3E0"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "Lato:https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap"
headingFont = "Lato:https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap"
baseFontSize = 14
headingFontSizes = ["26px", "20px", "16px", "14px", "13px", "12px"]
headingFontWeights = [900, 700, 700, 700, 700, 700]
# Brand chart order (orange = the RisCura data point)
chartCategoricalColors = ["#FF671D", "#1F3864", "#909288", "#2A8B7C", "#B0212C", "#F2C84A", "#26B7E6"]
# Semantic palette (spec bans pure red / tech green)
greenColor = "#1E8052"
redColor = "#B0212C"
orangeColor = "#FF671D"
blueColor = "#003B71"
grayColor = "#909288"
yellowColor = "#F2C84A"
dataframeBorderColor = "#E2E3E0"
dataframeHeaderBackgroundColor = "#F2F2F2"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F2"
borderColor = "#E2E3E0"

[browser]
gatherUsageStats = false

[server]
headless = true
